services:
  postgres:
    image: postgres:16-alpine
    container_name: arl-postgres
    environment:
      POSTGRES_USER: arl
      POSTGRES_PASSWORD: arl
      POSTGRES_DB: arl
    ports:
      - '5432:5432'
    volumes:
      - arl-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arl -d arl']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  arl-pg:
